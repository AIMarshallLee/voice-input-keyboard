name: VoType
options:
  bundleIdPrefix: com.voiceinput
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  # 主 App:引导安装、设置、隐私说明
  VoiceInputApp:
    type: application
    platform: iOS
    sources:
      - path: VoiceInputApp
        excludes:
          - "Info.plist"
          - "VoiceInputApp.entitlements"
          - "*.lproj"
      - path: VoiceInputApp/en.lproj
        type: folder
      - path: VoiceInputApp/zh-Hans.lproj
        type: folder
      - path: Shared
    info:
      path: VoiceInputApp/Info.plist
      properties:
        CFBundleDisplayName: VoType
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - zh-Hans
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "31"
        LSRequiresIPhoneOS: true
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: VoType needs microphone access for voice-to-text input
        NSSpeechRecognitionUsageDescription: VoType needs speech recognition to convert your voice to text
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.daseanle.votype
            CFBundleURLSchemes:
              - votype
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daseanle.votype
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "31"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: VoiceInputApp/VoiceInputApp.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: R765X25892
    dependencies:
      - target: KeyboardExtension

  # 键盘扩展:语音输入核心功能
  KeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: KeyboardExtension
        excludes:
          - "Info.plist"
          - "KeyboardExtension.entitlements"
          - "*.lproj"
      - path: KeyboardExtension/en.lproj
        type: folder
      - path: KeyboardExtension/zh-Hans.lproj
        type: folder
      - path: Shared
        excludes:
          - "TextProcessor.swift"
          - "SmartFormatter.swift"
          - "UsageTracker.swift"
    info:
      path: KeyboardExtension/Info.plist
      properties:
        CFBundleDisplayName: VoType
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - zh-Hans
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "29"
        NSMicrophoneUsageDescription: VoType needs microphone access for voice-to-text input
        NSSpeechRecognitionUsageDescription: VoType needs speech recognition to convert your voice to text
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeftLayout: false
            PrimaryLanguage: zh-Hans
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daseanle.votype.keyboard
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: KeyboardExtension/KeyboardExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: R765X25892

  # 单元测试:CI 自动运行,编译前验证代码逻辑
  VoTypeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VoTypeTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daseanle.votype.tests
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: VoiceInputApp
