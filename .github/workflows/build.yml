name: Build IPA

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Build and upload a distribution IPA to App Store Connect
        required: true
        default: false
        type: boolean
      upload_metadata:
        description: Upload App Store metadata and screenshots (publish must also be true)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  TEAM_ID: R765X25892
  APP_GROUP: group.com.daseanle.votype.container
  APP_VERSION: "1.0"
  CI_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Run Unit Tests
        run: |
          set -o pipefail

          SIM_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              for device in devices:
                  if 'iPhone' in device['name'] and device['isAvailable']:
                      print(device['udid'])
                      sys.exit(0)
          " 2>/dev/null)

          if [ -z "$SIM_ID" ]; then
            echo "No available iPhone simulator; tests are required."
            exit 1
          fi

          echo "Using simulator UDID: $SIM_ID"
          xcodebuild test \
            -project VoType.xcodeproj \
            -scheme VoTypeTests \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$CI_BUILD_NUMBER" \
            -derivedDataPath ./test_build 2>&1 | tee test_output.log

      - name: Check Development Signing Secrets
        id: check_signing
        if: >-
          github.event_name != 'pull_request' &&
          (github.event_name != 'workflow_dispatch' || inputs.publish != true)
        env:
          P12_BASE64: ${{ secrets.CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          PP_APP: ${{ secrets.PROVISIONING_PROFILE_APP }}
          PP_KEYBOARD: ${{ secrets.PROVISIONING_PROFILE_KEYBOARD }}
        run: |
          set -uo pipefail

          p12_is_valid() {
            local encoded="$1"
            local password="$2"
            local cert_file keychain_file keychain_password import_status
            cert_file=$(mktemp)
            keychain_file="$RUNNER_TEMP/votype-p12-check-$(uuidgen).keychain-db"
            keychain_password=$(uuidgen)
            if ! printf '%s' "$encoded" | base64 --decode > "$cert_file"; then
              rm -f "$cert_file"
              return 1
            fi

            import_status=0
            if ! security create-keychain -p "$keychain_password" "$keychain_file" \
              >/dev/null 2>&1; then
              import_status=1
            elif ! security unlock-keychain -p "$keychain_password" "$keychain_file" \
              >/dev/null 2>&1; then
              import_status=1
            elif ! security import "$cert_file" \
              -P "$password" -A -t cert -f pkcs12 -k "$keychain_file" \
              >/dev/null 2>&1; then
              import_status=1
            elif ! security find-identity -v -p codesigning "$keychain_file" \
              | grep -Eq '^[[:space:]]*[1-9][0-9]*\)'; then
              import_status=1
            fi

            security delete-keychain "$keychain_file" >/dev/null 2>&1 || true
            rm -f "$cert_file"
            return "$import_status"
          }

          profile_has_app_group() {
            local encoded="$1"
            local label="$2"
            local work_dir profile_file plist_file groups
            work_dir=$(mktemp -d)
            profile_file="$work_dir/profile.mobileprovision"
            plist_file="$work_dir/profile.plist"

            if ! printf '%s' "$encoded" | base64 --decode > "$profile_file"; then
              echo "$label is not valid base64"
              rm -rf "$work_dir"
              return 1
            fi
            if ! security cms -D -i "$profile_file" > "$plist_file" 2>/dev/null; then
              echo "$label is not a valid provisioning profile"
              rm -rf "$work_dir"
              return 1
            fi
            groups=$(/usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:com.apple.security.application-groups' \
              "$plist_file" 2>/dev/null || true)
            rm -rf "$work_dir"

            if ! printf '%s\n' "$groups" | grep -Fq "$APP_GROUP"; then
              echo "$label does not contain required App Group: $APP_GROUP"
              return 1
            fi
          }

          has_signing=true
          for required_name in P12_BASE64 P12_PASSWORD PP_APP PP_KEYBOARD; do
            if [ -z "${!required_name:-}" ]; then
              echo "Missing development signing secret: $required_name"
              has_signing=false
            fi
          done

          if [ "$has_signing" = true ] && \
             ! p12_is_valid "$P12_BASE64" "$P12_PASSWORD"; then
            echo "Development certificate or password is invalid"
            has_signing=false
          fi
          if [ "$has_signing" = true ] && \
             ! profile_has_app_group "$PP_APP" "App development profile"; then
            has_signing=false
          fi
          if [ "$has_signing" = true ] && \
             ! profile_has_app_group "$PP_KEYBOARD" "Keyboard development profile"; then
            has_signing=false
          fi

          echo "has_signing=$has_signing" >> "$GITHUB_OUTPUT"
          if [ "$has_signing" = true ]; then
            echo "Development signing configuration is valid"
          else
            echo "Development signing is unavailable; using an unsigned build"
          fi

      - name: Check Distribution Secrets
        id: check_dist
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        env:
          DIST_P12: ${{ secrets.DIST_CERTIFICATE_P12 }}
          DIST_PASSWORD: ${{ secrets.DIST_CERTIFICATE_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          set -uo pipefail

          p12_is_valid() {
            local encoded="$1"
            local password="$2"
            local cert_file keychain_file keychain_password import_status
            cert_file=$(mktemp)
            keychain_file="$RUNNER_TEMP/votype-p12-check-$(uuidgen).keychain-db"
            keychain_password=$(uuidgen)
            if ! printf '%s' "$encoded" | base64 --decode > "$cert_file"; then
              rm -f "$cert_file"
              return 1
            fi

            import_status=0
            if ! security create-keychain -p "$keychain_password" "$keychain_file" \
              >/dev/null 2>&1; then
              import_status=1
            elif ! security unlock-keychain -p "$keychain_password" "$keychain_file" \
              >/dev/null 2>&1; then
              import_status=1
            elif ! security import "$cert_file" \
              -P "$password" -A -t cert -f pkcs12 -k "$keychain_file" \
              >/dev/null 2>&1; then
              import_status=1
            elif ! security find-identity -v -p codesigning "$keychain_file" \
              | grep -Eq '^[[:space:]]*[1-9][0-9]*\)'; then
              import_status=1
            fi

            security delete-keychain "$keychain_file" >/dev/null 2>&1 || true
            rm -f "$cert_file"
            return "$import_status"
          }

          asc_key_is_valid() {
            local decoded_key
            if ! decoded_key=$(printf '%s' "$1" | base64 --decode 2>/dev/null); then
              return 1
            fi
            printf '%s\n' "$decoded_key" | grep -Eq \
              '^-----BEGIN (EC )?PRIVATE KEY-----$'
          }

          has_dist=true
          for required_name in \
            DIST_P12 DIST_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT; do
            if [ -z "${!required_name:-}" ]; then
              echo "Missing distribution secret: $required_name"
              has_dist=false
            fi
          done

          if [ "$has_dist" = true ] && \
             ! p12_is_valid "$DIST_P12" "$DIST_PASSWORD"; then
            echo "Distribution certificate or password is invalid"
            has_dist=false
          fi
          if [ "$has_dist" = true ] && \
             ! asc_key_is_valid "$ASC_KEY_CONTENT"; then
            echo "App Store Connect API key is not valid base64-encoded private key content"
            has_dist=false
          fi

          echo "has_dist=$has_dist" >> "$GITHUB_OUTPUT"
          if [ "$has_dist" = true ]; then
            echo "Distribution configuration is valid"
          else
            echo "Distribution configuration is incomplete or invalid"
          fi

      - name: Require Valid Distribution Configuration
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.publish == true &&
          steps.check_dist.outputs.has_dist != 'true'
        run: |
          echo "Publishing was requested, but distribution configuration is invalid."
          exit 1

      - name: Create Temporary Keychain
        if: >-
          steps.check_signing.outputs.has_signing == 'true' ||
          steps.check_dist.outputs.has_dist == 'true'
        run: |
          KEYCHAIN_FILE="$RUNNER_TEMP/votype-$(uuidgen).keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PASS"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_FILE"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_FILE"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_FILE"
          security list-keychains -d user -s "$KEYCHAIN_FILE"

          echo "KEYCHAIN_FILE=$KEYCHAIN_FILE" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASS=$KEYCHAIN_PASS" >> "$GITHUB_ENV"

      - name: Create App Store Connect API Key
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.publish == true &&
          steps.check_dist.outputs.has_dist == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ASC_API_KEY_PATH: ${{ runner.temp }}/app-store-connect-api-key.json
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          api_key = {
              "key_id": os.environ["ASC_KEY_ID"],
              "issuer_id": os.environ["ASC_ISSUER_ID"],
              "key": base64.b64decode(os.environ["ASC_KEY_CONTENT"]).decode("utf-8"),
              "in_house": False,
          }
          Path(os.environ["ASC_API_KEY_PATH"]).write_text(
              json.dumps(api_key), encoding="utf-8"
          )
          PY
          chmod 600 "$ASC_API_KEY_PATH"
          echo "ASC_API_KEY_PATH=$ASC_API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Import Development Certificate
        if: steps.check_signing.outputs.has_signing == 'true'
        env:
          P12_BASE64: ${{ secrets.CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          CERT_FILE=$(mktemp "$RUNNER_TEMP/votype-dev.XXXXXX")
          trap 'rm -f "$CERT_FILE"' EXIT
          printf '%s' "$P12_BASE64" | base64 --decode > "$CERT_FILE"
          security import "$CERT_FILE" \
            -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_FILE"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASS" \
            "$KEYCHAIN_FILE"

      - name: Install Development Provisioning Profiles
        if: steps.check_signing.outputs.has_signing == 'true'
        env:
          PP_APP: ${{ secrets.PROVISIONING_PROFILE_APP }}
          PP_KEYBOARD: ${{ secrets.PROVISIONING_PROFILE_KEYBOARD }}
        run: |
          set -euo pipefail
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"

          install_profile() {
            local encoded="$1"
            local output_name="$2"
            local temp_file uuid
            temp_file=$(mktemp "$RUNNER_TEMP/votype-profile.XXXXXX")
            printf '%s' "$encoded" | base64 --decode > "$temp_file"
            uuid=$(security cms -D -i "$temp_file" 2>/dev/null | plutil -extract UUID raw -)
            if [ -z "$uuid" ]; then
              echo "Unable to read provisioning profile UUID"
              rm -f "$temp_file"
              exit 1
            fi
            mv "$temp_file" "$PP_DIR/$uuid.mobileprovision"
            echo "$output_name=$uuid" >> "$GITHUB_ENV"
          }

          install_profile "$PP_APP" PP_UUID_APP
          install_profile "$PP_KEYBOARD" PP_UUID_KB

      - name: Build App (signed development)
        if: steps.check_signing.outputs.has_signing == 'true'
        run: |
          python3 inject_pp.py
          xcodebuild \
            -project VoType.xcodeproj \
            -scheme VoiceInputApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="Apple Development" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE="Manual" \
            CURRENT_PROJECT_VERSION="$CI_BUILD_NUMBER" \
            -derivedDataPath ./build \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_FILE"

      - name: Build App (unsigned fallback)
        if: >-
          (github.event_name != 'workflow_dispatch' || inputs.publish != true) &&
          steps.check_signing.outputs.has_signing != 'true'
        run: |
          xcodebuild \
            -project VoType.xcodeproj \
            -scheme VoiceInputApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            CURRENT_PROJECT_VERSION="$CI_BUILD_NUMBER" \
            -derivedDataPath ./build

      - name: Package Development IPA
        if: github.event_name != 'workflow_dispatch' || inputs.publish != true
        run: |
          APP_PATH=$(find ./build -name 'VoiceInputApp.app' -path '*/Release-iphoneos/*' | head -1)
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "VoiceInputApp.app was not produced"
            exit 1
          fi
          rm -rf Payload VoType.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry VoType.ipa Payload

      - name: Upload Development IPA
        if: github.event_name != 'workflow_dispatch' || inputs.publish != true
        uses: actions/upload-artifact@v4
        with:
          name: VoType-IPA
          path: VoType.ipa
          retention-days: 30

      - name: Import Distribution Certificate
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.publish == true &&
          steps.check_dist.outputs.has_dist == 'true'
        env:
          DIST_P12: ${{ secrets.DIST_CERTIFICATE_P12 }}
          DIST_PASSWORD: ${{ secrets.DIST_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_FILE=$(mktemp "$RUNNER_TEMP/votype-dist.XXXXXX")
          trap 'rm -f "$CERT_FILE"' EXIT
          printf '%s' "$DIST_P12" | base64 --decode > "$CERT_FILE"
          security import "$CERT_FILE" \
            -P "$DIST_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_FILE"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASS" \
            "$KEYCHAIN_FILE"

          DIST_IDENTITY_LIST=$(
            security find-identity -v -p codesigning "$KEYCHAIN_FILE" | \
              awk '/"Apple Distribution:/ {print toupper($2)}'
          )
          DIST_IDENTITY_COUNT=$(printf '%s\n' "$DIST_IDENTITY_LIST" | awk 'NF {count++} END {print count + 0}')
          DIST_IDENTITY_SHA1=$(printf '%s\n' "$DIST_IDENTITY_LIST" | awk 'NF {print; exit}')
          if [ "$DIST_IDENTITY_COUNT" -ne 1 ] || \
             ! printf '%s\n' "$DIST_IDENTITY_SHA1" | grep -Eq '^[0-9A-F]{40}$'; then
            echo "Expected exactly one Apple Distribution identity in the isolated keychain"
            exit 1
          fi
          echo "DIST_IDENTITY_SHA1=$DIST_IDENTITY_SHA1" >> "$GITHUB_ENV"

      - name: Generate Distribution Provisioning Profiles
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.publish == true &&
          steps.check_dist.outputs.has_dist == 'true'
        env:
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: |
          set -euo pipefail
          PROFILE_OUTPUT_DIR="$RUNNER_TEMP/votype-app-store-profiles"
          mkdir -p "$PROFILE_OUTPUT_DIR"

          fastlane run sigh \
            api_key_path:"$ASC_API_KEY_PATH" \
            app_identifier:"com.daseanle.votype" \
            team_id:"$TEAM_ID" \
            platform:ios \
            provisioning_name:"VoType App AppStore container-v1" \
            ignore_profiles_with_different_name:true \
            fail_on_name_taken:true \
            output_path:"$PROFILE_OUTPUT_DIR" \
            filename:"votype-app.mobileprovision" \
            skip_install:true \
            force:false

          fastlane run sigh \
            api_key_path:"$ASC_API_KEY_PATH" \
            app_identifier:"com.daseanle.votype.keyboard" \
            team_id:"$TEAM_ID" \
            platform:ios \
            provisioning_name:"VoType Keyboard AppStore container-v1" \
            ignore_profiles_with_different_name:true \
            fail_on_name_taken:true \
            output_path:"$PROFILE_OUTPUT_DIR" \
            filename:"votype-keyboard.mobileprovision" \
            skip_install:true \
            force:false

          DIST_PP_APP_PATH="$PROFILE_OUTPUT_DIR/votype-app.mobileprovision"
          DIST_PP_KEYBOARD_PATH="$PROFILE_OUTPUT_DIR/votype-keyboard.mobileprovision"
          test -s "$DIST_PP_APP_PATH"
          test -s "$DIST_PP_KEYBOARD_PATH"
          echo "DIST_PP_APP_PATH=$DIST_PP_APP_PATH" >> "$GITHUB_ENV"
          echo "DIST_PP_KEYBOARD_PATH=$DIST_PP_KEYBOARD_PATH" >> "$GITHUB_ENV"

      - name: Install Distribution Provisioning Profiles
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.publish == true &&
          steps.check_dist.outputs.has_dist == 'true'
        run: |
          set -euo pipefail
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"

          install_profile() {
            local profile_file="$1"
            local output_name="$2"
            local bundle_id="$3"
            local plist_file uuid app_identifier team_identifier
            plist_file=$(mktemp "$RUNNER_TEMP/votype-profile.XXXXXX")

            if ! security cms -D -i "$profile_file" > "$plist_file" 2>/dev/null; then
              echo "$profile_file is not a valid provisioning profile"
              rm -f "$plist_file"
              exit 1
            fi

            uuid=$(plutil -extract UUID raw -o - "$plist_file")
            if [ -z "$uuid" ]; then
              echo "Unable to read provisioning profile UUID"
              rm -f "$plist_file"
              exit 1
            fi

            app_identifier=$(plutil -extract Entitlements.application-identifier raw -o - "$plist_file")
            if [ "$app_identifier" != "$TEAM_ID.$bundle_id" ]; then
              echo "Profile application identifier mismatch for $bundle_id: $app_identifier"
              rm -f "$plist_file"
              exit 1
            fi

            team_identifier=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$plist_file")
            if [ "$team_identifier" != "$TEAM_ID" ]; then
              echo "Profile team mismatch for $bundle_id: $team_identifier"
              rm -f "$plist_file"
              exit 1
            fi

            if plutil -extract ProvisionedDevices json -o - "$plist_file" >/dev/null 2>&1 || \
               plutil -extract ProvisionsAllDevices raw -o - "$plist_file" >/dev/null 2>&1; then
              echo "Profile for $bundle_id is device-scoped and cannot be used for App Store distribution"
              rm -f "$plist_file"
              exit 1
            fi

            PROFILE_PLIST="$plist_file" python3 - <<'PY'
          import hashlib
          import os
          import plistlib

          with open(os.environ["PROFILE_PLIST"], "rb") as handle:
              profile = plistlib.load(handle)

          entitlements = profile.get("Entitlements", {})
          team_id = os.environ["TEAM_ID"]
          if profile.get("TeamIdentifier") != [team_id]:
              raise SystemExit(f"Profile TeamIdentifier is not exactly [{team_id!r}]")
          if entitlements.get("com.apple.developer.team-identifier") != team_id:
              raise SystemExit(f"Profile team entitlement is not {team_id}")
          if entitlements.get("get-task-allow") is not False:
              raise SystemExit("Profile get-task-allow is not explicitly false")

          groups = entitlements.get("com.apple.security.application-groups")
          required = os.environ["APP_GROUP"]
          if groups != [required]:
              raise SystemExit(f"Profile App Groups are not exactly [{required!r}]")

          expected_sha1 = os.environ["DIST_IDENTITY_SHA1"].upper()
          certificates = profile.get("DeveloperCertificates", [])
          if len(certificates) != 1:
              raise SystemExit("Profile does not contain exactly one distribution certificate")
          certificate_sha1s = {
              hashlib.sha1(certificate).hexdigest().upper()
              for certificate in certificates
          }
          if expected_sha1 not in certificate_sha1s:
              raise SystemExit("Profile is not bound to the imported distribution certificate")
          PY

            cp "$profile_file" "$PP_DIR/$uuid.mobileprovision"
            rm -f "$plist_file"
            echo "$output_name=$uuid" >> "$GITHUB_ENV"
          }

          install_profile "$DIST_PP_APP_PATH" DIST_PP_UUID_APP com.daseanle.votype
          install_profile "$DIST_PP_KEYBOARD_PATH" DIST_PP_UUID_KB com.daseanle.votype.keyboard

      - name: Build App Store IPA
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.publish == true &&
          steps.check_dist.outputs.has_dist == 'true'
        run: |
          xcodegen generate
          PP_UUID_APP="$DIST_PP_UUID_APP" \
            PP_UUID_KB="$DIST_PP_UUID_KB" \
            python3 inject_pp.py

          xcodebuild \
            -project VoType.xcodeproj \
            -scheme VoiceInputApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="$DIST_IDENTITY_SHA1" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE="Manual" \
            CURRENT_PROJECT_VERSION="$CI_BUILD_NUMBER" \
            -derivedDataPath ./build_dist \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_FILE"

          APP_PATH=$(find ./build_dist -name 'VoiceInputApp.app' -path '*/Release-iphoneos/*' | head -1)
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Distribution VoiceInputApp.app was not produced"
            exit 1
          fi

          KEYBOARD_PATH="$APP_PATH/PlugIns/KeyboardExtension.appex"
          if [ ! -d "$KEYBOARD_PATH" ]; then
            echo "Distribution KeyboardExtension.appex was not produced"
            exit 1
          fi

          verify_signed_bundle() {
            local bundle_path="$1"
            local bundle_id="$2"
            local label="$3"
            local expected_profile_uuid="$4"
            local entitlements_file embedded_plist embedded_uuid cert_prefix cert_sha1
            entitlements_file=$(mktemp "$RUNNER_TEMP/votype-entitlements.XXXXXX")
            echo "Verifying $label signature, entitlements, signer, and embedded profile"
            if ! codesign --verify -vvv "$bundle_path"; then
              echo "$label code signature verification failed"
              rm -f "$entitlements_file"
              exit 1
            fi
            if ! codesign --display --entitlements :- "$bundle_path" \
              > "$entitlements_file" 2>/dev/null; then
              echo "Unable to extract $label entitlements"
              rm -f "$entitlements_file"
              exit 1
            fi
            plutil -convert xml1 "$entitlements_file"

            SIGNED_ENTITLEMENTS="$entitlements_file" \
              SIGNED_INFO_PLIST="$bundle_path/Info.plist" \
              EXPECTED_BUNDLE_ID="$bundle_id" \
              python3 - <<'PY'
          import os
          import plistlib

          with open(os.environ["SIGNED_ENTITLEMENTS"], "rb") as handle:
              entitlements = plistlib.load(handle)
          with open(os.environ["SIGNED_INFO_PLIST"], "rb") as handle:
              info = plistlib.load(handle)

          team_id = os.environ["TEAM_ID"]
          bundle_id = os.environ["EXPECTED_BUNDLE_ID"]
          if info.get("CFBundleIdentifier") != bundle_id:
              raise SystemExit(f"Signed bundle identifier is not {bundle_id}")
          expected_identifier = f"{team_id}.{bundle_id}"
          if entitlements.get("application-identifier") != expected_identifier:
              raise SystemExit(
                  f"Signed bundle application identifier is not {expected_identifier}"
              )
          if entitlements.get("com.apple.developer.team-identifier") != team_id:
              raise SystemExit(f"Signed bundle team identifier is not {team_id}")

          groups = entitlements.get("com.apple.security.application-groups")
          required = os.environ["APP_GROUP"]
          if groups != [required]:
              raise SystemExit(f"Signed bundle App Groups are not exactly [{required!r}]")
          PY

            cert_prefix="$RUNNER_TEMP/votype-signer-$(uuidgen)-"
            codesign -d --extract-certificates "$cert_prefix" "$bundle_path" 2>/dev/null
            cert_sha1=$(shasum -a 1 "${cert_prefix}0" | awk '{print toupper($1)}')
            rm -f \
              "${cert_prefix}0" "${cert_prefix}1" \
              "${cert_prefix}2" "${cert_prefix}3"
            if [ "$cert_sha1" != "$DIST_IDENTITY_SHA1" ]; then
              echo "$label signer does not match the imported distribution certificate"
              rm -f "$entitlements_file"
              exit 1
            fi

            embedded_plist=$(mktemp "$RUNNER_TEMP/votype-embedded-profile.XXXXXX")
            if ! security cms -D -i "$bundle_path/embedded.mobileprovision" \
              > "$embedded_plist" 2>/dev/null; then
              echo "$label does not contain a valid embedded provisioning profile"
              rm -f "$entitlements_file" "$embedded_plist"
              exit 1
            fi
            embedded_uuid=$(plutil -extract UUID raw -o - "$embedded_plist")
            rm -f "$entitlements_file" "$embedded_plist"
            if [ "$embedded_uuid" != "$expected_profile_uuid" ]; then
              echo "$label embedded provisioning profile UUID mismatch: $embedded_uuid"
              exit 1
            fi
          }

          verify_signed_bundle \
            "$APP_PATH" com.daseanle.votype "Main app" "$DIST_PP_UUID_APP"
          verify_signed_bundle \
            "$KEYBOARD_PATH" com.daseanle.votype.keyboard "Keyboard extension" "$DIST_PP_UUID_KB"
          codesign --verify -vvv --deep "$APP_PATH"

          rm -rf Payload_dist VoType-AppStore.ipa
          mkdir -p Payload_dist/Payload
          cp -R "$APP_PATH" Payload_dist/Payload/
          (cd Payload_dist && zip -qry ../VoType-AppStore.ipa Payload)

      - name: Upload App Store IPA Artifact
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.publish == true &&
          steps.check_dist.outputs.has_dist == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VoType-AppStore-IPA
          path: VoType-AppStore.ipa
          retention-days: 30

      - name: Upload to App Store Connect
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.publish == true &&
          steps.check_dist.outputs.has_dist == 'true'
        run: |
          fastlane pilot upload \
            --ipa VoType-AppStore.ipa \
            --api-key-path "$ASC_API_KEY_PATH"

      - name: Upload Metadata and Screenshots
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.publish == true &&
          inputs.upload_metadata == true &&
          steps.check_dist.outputs.has_dist == 'true'
        run: |
          fastlane deliver \
            --api-key-path "$ASC_API_KEY_PATH" \
            --metadata fastlane/metadata \
            --screenshots fastlane/screenshots \
            --skip_binary_upload \
            --app_version "$APP_VERSION" \
            --force \
            --precheck_include_in_app_purchases false

      - name: Cleanup Signing Material
        if: always()
        run: |
          if [ -n "${KEYCHAIN_FILE:-}" ]; then
            security delete-keychain "$KEYCHAIN_FILE" 2>/dev/null || true
          fi
          if [ -n "${ASC_API_KEY_PATH:-}" ]; then
            rm -f "$ASC_API_KEY_PATH"
          fi
