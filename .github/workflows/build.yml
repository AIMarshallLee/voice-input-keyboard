name: Build & Sign IPA

on:
  workflow_dispatch:
    inputs:
      signed:
        description: '使用开发者证书签名'
        required: false
        default: 'true'
  push:
    branches: [main]

env:
  TEAM_ID: JVP8SN8P4M

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s $(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      # ---- 签名构建 ----
      - name: Import Certificate
        if: github.event.inputs.signed == 'true' || github.event_name == 'push'
        env:
          P12_BASE64: ${{ secrets.CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          CERT_FILE=$(mktemp /tmp/certificate.XXXXXX.p12)
          KEYCHAIN_FILE=$(mktemp /tmp/keychain.XXXXXX.keychain-db)
          KEYCHAIN_PASS=$(uuidgen)

          echo "$P12_BASE64" | base64 --decode > "$CERT_FILE"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_FILE"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_FILE"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_FILE"

          security import "$CERT_FILE" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_FILE"
          security list-keychains -d user -s "$KEYCHAIN_FILE" $(security list-keychains -d user | tr -d '"')

          echo "KEYCHAIN_FILE=$KEYCHAIN_FILE" >> $GITHUB_ENV
          rm -f "$CERT_FILE"

      - name: Install Provisioning Profiles
        if: github.event.inputs.signed == 'true' || github.event_name == 'push'
        env:
          PP_APP: ${{ secrets.PROVISIONING_PROFILE_APP }}
          PP_KEYBOARD: ${{ secrets.PROVISIONING_PROFILE_KEYBOARD }}
        run: |
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"

          if [ -n "$PP_APP" ]; then
            echo "$PP_APP" | base64 --decode > "$PP_DIR/app.mobileprovision"
            PP_UUID_APP=$(grep -A1 -a UUID "$PP_DIR/app.mobileprovision" | grep -o '[0-9A-F-]\{36\}')
            mv "$PP_DIR/app.mobileprovision" "$PP_DIR/$PP_UUID_APP.mobileprovision"
            echo "PP_UUID_APP=$PP_UUID_APP" >> $GITHUB_ENV
          fi

          if [ -n "$PP_KEYBOARD" ]; then
            echo "$PP_KEYBOARD" | base64 --decode > "$PP_DIR/keyboard.mobileprovision"
            PP_UUID_KB=$(grep -A1 -a UUID "$PP_DIR/keyboard.mobileprovision" | grep -o '[0-9A-F-]\{36\}')
            mv "$PP_DIR/keyboard.mobileprovision" "$PP_DIR/$PP_UUID_KB.mobileprovision"
            echo "PP_UUID_KB=$PP_UUID_KB" >> $GITHUB_ENV
          fi

      - name: Build App (signed)
        if: env.PP_UUID_APP != '' && env.PP_UUID_KB != ''
        run: |
          xcodebuild \
            -project VoiceInputKeyboard.xcodeproj \
            -scheme VoiceInputApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_VoiceInputApp="$PP_UUID_APP" \
            PROVISIONING_PROFILE_KeyboardExtension="$PP_UUID_KB" \
            -derivedDataPath ./build

      # ---- 无签名回退构建 ----
      - name: Build App (unsigned fallback)
        if: env.PP_UUID_APP == '' || env.PP_UUID_KB == ''
        run: |
          xcodebuild \
            -project VoiceInputKeyboard.xcodeproj \
            -scheme VoiceInputApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            -derivedDataPath ./build

      - name: Cleanup Keychain
        if: always()
        run: |
          if [ -n "$KEYCHAIN_FILE" ]; then
            security delete-keychain "$KEYCHAIN_FILE" || true
          fi

      - name: Package IPA
        run: |
          APP_PATH=$(find ./build -name "VoiceInputApp.app" -path "*/Release-iphoneos/*" | head -1)
          echo "Found: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r VoiceInputKeyboard.ipa Payload
          ls -la VoiceInputKeyboard.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VoiceInputKeyboard-IPA
          path: VoiceInputKeyboard.ipa
          retention-days: 30
