name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  TEAM_ID: R765X25892

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s $(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      # ---- 检查是否有签名 secrets ----
      - name: Check Signing Secrets
        id: check_secrets
        env:
          PP_APP: ${{ secrets.PROVISIONING_PROFILE_APP }}
          PP_KEYBOARD: ${{ secrets.PROVISIONING_PROFILE_KEYBOARD }}
        run: |
          if [ -n "$PP_APP" ] && [ -n "$PP_KEYBOARD" ]; then
            echo "has_signing=true" >> $GITHUB_OUTPUT
            echo "✅ 签名 secrets 已配置"
          else
            echo "has_signing=false" >> $GITHUB_OUTPUT
            echo "⚠️ 签名 secrets 未配置,使用无签名构建"
          fi

      # ---- 签名:导入证书 ----
      - name: Import Certificate
        if: steps.check_secrets.outputs.has_signing == 'true'
        env:
          P12_BASE64: ${{ secrets.CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          CERT_FILE="/tmp/$(uuidgen).p12"
          KEYCHAIN_FILE="/tmp/$(uuidgen).keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"

          echo "$P12_BASE64" | base64 --decode > "$CERT_FILE"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_FILE"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_FILE"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_FILE"

          security import "$CERT_FILE" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_FILE"
          security list-keychains -d user -s "$KEYCHAIN_FILE" login.keychain-db

          echo "KEYCHAIN_FILE=$KEYCHAIN_FILE" >> $GITHUB_ENV
          rm -f "$CERT_FILE"

      # ---- 签名:安装描述文件 ----
      - name: Install Provisioning Profiles
        if: steps.check_secrets.outputs.has_signing == 'true'
        env:
          PP_APP: ${{ secrets.PROVISIONING_PROFILE_APP }}
          PP_KEYBOARD: ${{ secrets.PROVISIONING_PROFILE_KEYBOARD }}
        run: |
          set -ex
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"

          # App 主目标
          echo "$PP_APP" | base64 --decode > "$PP_DIR/app.mobileprovision"
          ls -la "$PP_DIR/app.mobileprovision"
          PP_UUID_APP=$(security cms -D -i "$PP_DIR/app.mobileprovision" 2>/dev/null | plutil -extract UUID raw -)
          echo "App PP UUID: $PP_UUID_APP"
          mv "$PP_DIR/app.mobileprovision" "$PP_DIR/$PP_UUID_APP.mobileprovision"
          echo "PP_UUID_APP=$PP_UUID_APP" >> $GITHUB_ENV

          # 键盘扩展
          echo "$PP_KEYBOARD" | base64 --decode > "$PP_DIR/keyboard.mobileprovision"
          ls -la "$PP_DIR/keyboard.mobileprovision"
          PP_UUID_KB=$(security cms -D -i "$PP_DIR/keyboard.mobileprovision" 2>/dev/null | plutil -extract UUID raw -)
          echo "Keyboard PP UUID: $PP_UUID_KB"
          mv "$PP_DIR/keyboard.mobileprovision" "$PP_DIR/$PP_UUID_KB.mobileprovision"
          echo "PP_UUID_KB=$PP_UUID_KB" >> $GITHUB_ENV

      # ---- 签名构建 ----
      - name: Build App (signed)
        if: steps.check_secrets.outputs.has_signing == 'true'
        run: |
          # 用 Python 脚本注入 PROVISIONING_PROFILE UUID
          python3 inject_pp.py

          # 验证注入结果
          grep -c "PROVISIONING_PROFILE" VoType.xcodeproj/project.pbxproj || true

          xcodebuild \
            -project VoType.xcodeproj \
            -scheme VoiceInputApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="Apple Development" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE="Manual" \
            -derivedDataPath ./build \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_FILE"

      # ---- 无签名回退构建 ----
      - name: Build App (unsigned)
        if: steps.check_secrets.outputs.has_signing != 'true'
        run: |
          xcodebuild \
            -project VoType.xcodeproj \
            -scheme VoiceInputApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            -derivedDataPath ./build

      - name: Package Dev IPA
        run: |
          APP_PATH=$(find ./build -name "VoiceInputApp.app" -path "*/Release-iphoneos/*" | head -1)
          echo "Found: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r VoType.ipa Payload
          ls -la VoType.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VoType-IPA
          path: VoType.ipa
          retention-days: 30

      # ---- App Store 发布构建 ----
      - name: Check Distribution Secrets
        id: check_dist
        env:
          DIST_P12: ${{ secrets.DIST_CERTIFICATE_P12 }}
          DIST_PP_APP: ${{ secrets.DIST_PP_APP }}
          DIST_PP_KB: ${{ secrets.DIST_PP_KEYBOARD }}
        run: |
          if [ -n "$DIST_P12" ] && [ -n "$DIST_PP_APP" ] && [ -n "$DIST_PP_KB" ]; then
            echo "has_dist=true" >> $GITHUB_OUTPUT
            echo "✅ 发布 secrets 已配置"
          else
            echo "has_dist=false" >> $GITHUB_OUTPUT
            echo "⚠️ 发布 secrets 未配置"
          fi

      - name: Import Distribution Certificate
        if: steps.check_dist.outputs.has_dist == 'true'
        env:
          P12_BASE64: ${{ secrets.DIST_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.DIST_CERTIFICATE_PASSWORD }}
        run: |
          CERT_FILE="/tmp/dist_cert.p12"
          echo "$P12_BASE64" | base64 --decode > "$CERT_FILE"
          security import "$CERT_FILE" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_FILE"
          rm -f "$CERT_FILE"
          echo "Distribution cert imported"

      - name: Install Distribution Profiles
        if: steps.check_dist.outputs.has_dist == 'true'
        env:
          DIST_PP_APP: ${{ secrets.DIST_PP_APP }}
          DIST_PP_KB: ${{ secrets.DIST_PP_KEYBOARD }}
        run: |
          set -ex
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "$DIST_PP_APP" | base64 --decode > "$PP_DIR/dist_app.mobileprovision"
          DIST_PP_UUID_APP=$(security cms -D -i "$PP_DIR/dist_app.mobileprovision" 2>/dev/null | plutil -extract UUID raw -)
          mv "$PP_DIR/dist_app.mobileprovision" "$PP_DIR/$DIST_PP_UUID_APP.mobileprovision"
          echo "DIST_PP_UUID_APP=$DIST_PP_UUID_APP" >> $GITHUB_ENV

          echo "$DIST_PP_KB" | base64 --decode > "$PP_DIR/dist_keyboard.mobileprovision"
          DIST_PP_UUID_KB=$(security cms -D -i "$PP_DIR/dist_keyboard.mobileprovision" 2>/dev/null | plutil -extract UUID raw -)
          mv "$PP_DIR/dist_keyboard.mobileprovision" "$PP_DIR/$DIST_PP_UUID_KB.mobileprovision"
          echo "DIST_PP_UUID_KB=$DIST_PP_UUID_KB" >> $GITHUB_ENV

      - name: Build App Store IPA
        if: steps.check_dist.outputs.has_dist == 'true'
        run: |
          # 用 Python 注入 Distribution PP UUID
          PP_UUID_APP="$DIST_PP_UUID_APP" PP_UUID_KB="$DIST_PP_UUID_KB" python3 inject_pp.py

          xcodebuild \
            -project VoType.xcodeproj \
            -scheme VoiceInputApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE="Manual" \
            -derivedDataPath ./build_dist \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_FILE"

          # 打包 App Store IPA
          APP_PATH=$(find ./build_dist -name "VoiceInputApp.app" -path "*/Release-iphoneos/*" | head -1)
          rm -rf Payload_dist && mkdir -p Payload_dist/Payload
          cp -r "$APP_PATH" Payload_dist/Payload/
          cd Payload_dist && zip -r ../VoType-AppStore.ipa Payload && cd ..

      - name: Upload App Store IPA
        if: steps.check_dist.outputs.has_dist == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VoType-AppStore-IPA
          path: VoType-AppStore.ipa
          retention-days: 30

      - name: Cleanup Keychain
        if: always()
        run: |
          if [ -n "$KEYCHAIN_FILE" ]; then
            security delete-keychain "$KEYCHAIN_FILE" 2>/dev/null || true
          fi
