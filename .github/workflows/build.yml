name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  TEAM_ID: R765X25892

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s $(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      # ---- 检查是否有签名 secrets ----
      - name: Check Signing Secrets
        id: check_secrets
        env:
          PP_APP: ${{ secrets.PROVISIONING_PROFILE_APP }}
          PP_KEYBOARD: ${{ secrets.PROVISIONING_PROFILE_KEYBOARD }}
        run: |
          if [ -n "$PP_APP" ] && [ -n "$PP_KEYBOARD" ]; then
            echo "has_signing=true" >> $GITHUB_OUTPUT
            echo "✅ 签名 secrets 已配置"
          else
            echo "has_signing=false" >> $GITHUB_OUTPUT
            echo "⚠️ 签名 secrets 未配置,使用无签名构建"
          fi

      # ---- 签名:导入证书 ----
      - name: Import Certificate
        if: steps.check_secrets.outputs.has_signing == 'true'
        env:
          P12_BASE64: ${{ secrets.CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          CERT_FILE="/tmp/$(uuidgen).p12"
          KEYCHAIN_FILE="/tmp/$(uuidgen).keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"

          echo "$P12_BASE64" | base64 --decode > "$CERT_FILE"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_FILE"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_FILE"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_FILE"

          security import "$CERT_FILE" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_FILE"
          security list-keychains -d user -s "$KEYCHAIN_FILE" login.keychain-db

          echo "KEYCHAIN_FILE=$KEYCHAIN_FILE" >> $GITHUB_ENV
          rm -f "$CERT_FILE"

      # ---- 签名:安装描述文件 ----
      - name: Install Provisioning Profiles
        if: steps.check_secrets.outputs.has_signing == 'true'
        env:
          PP_APP: ${{ secrets.PROVISIONING_PROFILE_APP }}
          PP_KEYBOARD: ${{ secrets.PROVISIONING_PROFILE_KEYBOARD }}
        run: |
          set -ex
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"

          # App 主目标
          echo "$PP_APP" | base64 --decode > "$PP_DIR/app.mobileprovision"
          ls -la "$PP_DIR/app.mobileprovision"
          PP_UUID_APP=$(security cms -D -i "$PP_DIR/app.mobileprovision" 2>/dev/null | plutil -extract UUID raw -)
          echo "App PP UUID: $PP_UUID_APP"
          mv "$PP_DIR/app.mobileprovision" "$PP_DIR/$PP_UUID_APP.mobileprovision"
          echo "PP_UUID_APP=$PP_UUID_APP" >> $GITHUB_ENV

          # 键盘扩展
          echo "$PP_KEYBOARD" | base64 --decode > "$PP_DIR/keyboard.mobileprovision"
          ls -la "$PP_DIR/keyboard.mobileprovision"
          PP_UUID_KB=$(security cms -D -i "$PP_DIR/keyboard.mobileprovision" 2>/dev/null | plutil -extract UUID raw -)
          echo "Keyboard PP UUID: $PP_UUID_KB"
          mv "$PP_DIR/keyboard.mobileprovision" "$PP_DIR/$PP_UUID_KB.mobileprovision"
          echo "PP_UUID_KB=$PP_UUID_KB" >> $GITHUB_ENV

      # ---- 签名构建 ----
      - name: Build App (signed)
        if: steps.check_secrets.outputs.has_signing == 'true'
        env:
          PP_UUID_APP: ${{ env.PP_UUID_APP }}
          PP_UUID_KB: ${{ env.PP_UUID_KB }}
        run: |
          # 在 xcodeproj 中按 target 注入 PROVISIONING_PROFILE UUID
          python3 << 'PYEOF'
          import re

          pp_app = "$PP_UUID_APP"
          pp_kb = "$PP_UUID_KB"

          with open('VoType.xcodeproj/project.pbxproj', 'r') as f:
              content = f.read()

          # 找到 VoiceInputApp 的 Build Settings block，注入 PROVISIONING_PROFILE
          # 按 target name 附近的 build settings 注入
          # 策略：找包含 "com.voiceinput.app" 的行附近，注入 PROVISIONING_PROFILE
          # 更简单的方法：用 PROVISIONING_PROFILE_SPECIFIER 指定名字

          # 把所有 PROVISIONING_PROFILE_SPECIFIER 清空
          content = re.sub(
              r'PROVISIONING_PROFILE_SPECIFIER = "[^"]*";',
              'PROVISIONING_PROFILE_SPECIFIER = "";',
              content
          )
          # 把所有 PROVISIONING_PROFILE 清空
          content = re.sub(
              r'PROVISIONING_PROFILE = "[^"]*";',
              'PROVISIONING_PROFILE = "";',
              content
          )

          # 通过 PRODUCT_BUNDLE_IDENTIFIER 找到对应 target 的 build settings block
          # VoiceInputApp target: com.voiceinput.app
          # KeyboardExtension target: com.voiceinput.votype.keyboard

          # 对 App target：在 com.voiceinput.app 后面注入 PROVISIONING_PROFILE
          content = content.replace(
              'PRODUCT_BUNDLE_IDENTIFIER = "com.voiceinput.app";',
              'PRODUCT_BUNDLE_IDENTIFIER = "com.voiceinput.app";\n\t\t\t\tPROVISIONING_PROFILE = "' + pp_app + '";'
          )

          # 对 Keyboard target：在 com.voiceinput.votype.keyboard 后面注入 PROVISIONING_PROFILE
          content = content.replace(
              'PRODUCT_BUNDLE_IDENTIFIER = "com.voiceinput.votype.keyboard";',
              'PRODUCT_BUNDLE_IDENTIFIER = "com.voiceinput.votype.keyboard";\n\t\t\t\tPROVISIONING_PROFILE = "' + pp_kb + '";'
          )

          with open('VoType.xcodeproj/project.pbxproj', 'w') as f:
              f.write(content)
          print(f'Injected PP UUIDs: App={pp_app}, KB={pp_kb}')
          PYEOF

          xcodebuild \
            -project VoType.xcodeproj \
            -scheme VoiceInputApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="Apple Development" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE="Manual" \
            -derivedDataPath ./build \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_FILE"

      # ---- 无签名回退构建 ----
      - name: Build App (unsigned)
        if: steps.check_secrets.outputs.has_signing != 'true'
        run: |
          xcodebuild \
            -project VoType.xcodeproj \
            -scheme VoiceInputApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            -derivedDataPath ./build

      - name: Cleanup Keychain
        if: always()
        run: |
          if [ -n "$KEYCHAIN_FILE" ]; then
            security delete-keychain "$KEYCHAIN_FILE" 2>/dev/null || true
          fi

      - name: Package IPA
        run: |
          APP_PATH=$(find ./build -name "VoiceInputApp.app" -path "*/Release-iphoneos/*" | head -1)
          echo "Found: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r VoType.ipa Payload
          ls -la VoType.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VoType-IPA
          path: VoType.ipa
          retention-days: 30
